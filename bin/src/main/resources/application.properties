spring.application.name=REACT_CHALLAN


# Server Port
server.port=8081

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/myapi_db
spring.datasource.username=postgres
spring.datasource.password=12345
spring.datasource.driver-class-name=org.postgresql.Driver


# JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.com.challan=DEBUG

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.file-size-threshold=2KB
#spring.servlet.multipart.location=uploads

# File Storage Path
file.upload-dir=uploads/
#logging.level.org.springframework.web.multipart=TRACE
logging.level.org.apache.tomcat.util.http.fileupload=DEBUG




logging.level.org.springframework.web=TRACE
logging.level.org.springframework.web.multipart=TRACE
logging.level.org.apache.tomcat=DEBUG
server.error.include-stacktrace=always
server.error.include-message=always


# JWT Configuration - MATCH VAHAN_API SECRET KEY
app.jwt.secret=MySuperLongSecretKeyThatIsDefinitelyLongerThan64BytesForHS512Algorithm!
app.jwt.expiration=86400000




# Logging
logging.level.com.challan.user=DEBUG